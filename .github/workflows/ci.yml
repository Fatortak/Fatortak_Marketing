name: Marketing checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check server
        run: node --check server.mjs
      - name: Check adapters
        run: node --check adapters.mjs
      - name: Check dashboard
        run: node --check public/app.js

  data:
    name: Data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate JSON files
        run: |
          node -e "for (const f of ['content/queue.json','config.example.json']) { JSON.parse(require('fs').readFileSync(f, 'utf8')); console.log('ok', f); }"
